<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="copperGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CC996E"/>
      <stop offset="50%" stop-color="#C9956C"/>
      <stop offset="100%" stop-color="#C09050"/>
    </linearGradient>
  </defs>

  <!-- Front-facing bear silhouette -->
  <path fill="url(#copperGrad)" d="
    M 27,28
    C 22,28 16,23 16,17
    C 16,10.5 22,7 28.5,7
    C 33,7 36.5,10 38,14.5
    C 41.5,12.5 45.5,11.5 50,11.5
    C 54.5,11.5 58.5,12.5 62,14.5
    C 63.5,10 67,7 71.5,7
    C 78,7 84,10.5 84,17
    C 84,23 78,28 73,28
    C 82,34 89,43 89,54
    C 89,62 84,68 76,71
    C 72,81 63,92 50,92
    C 37,92 28,81 24,71
    C 16,68 11,62 11,54
    C 11,43 18,34 27,28
    Z"/>

  <!-- Muzzle -->
  <ellipse cx="50" cy="75" rx="21" ry="15" fill="#D4A87A"/>

  <!-- Circuit traces form the facial features -->
  <g stroke="#1C2840" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Straight traces from the crown pad to the inner-ear pads -->
    <path d="M27,14 L50,22 L73,14"/>
    <!-- Spine, crown to the top of the nose pad -->
    <path d="M50,22 L50,68"/>
    <!-- Brow traces end at the eye centres -->
    <path d="M36,51 L50,40 L64,51"/>
    <!-- Mouth under the nose pad -->
    <path d="M50,80 L50,83.5 Q50,87.2 44,87.6"/>
    <path d="M50,83.5 Q50,87.2 56,87.6"/>
  </g>

  <g fill="#1C2840">
    <circle cx="27" cy="14" r="2.4"/>
    <circle cx="73" cy="14" r="2.4"/>
    <circle cx="50" cy="22" r="2.4"/>
    <circle cx="50" cy="40" r="2.4"/>
    <!-- Eyes: annular pads with vias as pupils -->
    <circle cx="36" cy="51" r="6.4"/>
    <circle cx="64" cy="51" r="6.4"/>
    <!-- Nose: rounded IC pad, centred on the spine -->
    <rect x="43" y="68" width="14" height="12" rx="3.5"/>
  </g>
  <circle cx="36" cy="51" r="2.8" fill="#D4A87A"/>
  <circle cx="64" cy="51" r="2.8" fill="#D4A87A"/>
  <circle cx="50" cy="74" r="2.2" fill="#D4A87A" opacity="0.55"/>
</svg>
